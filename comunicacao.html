<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIC - Comunicação</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <input type="checkbox" id="sidebar-checkbox">

        <label for="sidebar-checkbox" class="sidebar-btn">≡</label>

        <nav class="sidebar">
            <ul class="sidebar-list">
                <li class="sidebar-item"><a href="sobre.html" class="sidebar-link">&bull; Sobre nós</a></li>
                <li class="sidebar-item"><a href="ajuda.html" class="sidebar-link">&bull; Ajuda</a></li>
                <li class="sidebar-item"><a href="config.html" class="sidebar-link">&bull; Configurações</a></li>
            </ul>
        </nav>

        <div class="logo">
            <h1>
                <span class="text-highlight">S</span><span>ISTEMA </span><span
                    class="text-highlight">I</span><span>NTEGRADO DE </span><span
                    class="text-highlight">C</span><span>AMPUS</span>
            </h1>
        </div>
        <nav class="navbar">
            <a href="index.html" class="navbar-link">Início</a>
            <a href="manutencao.html" class="navbar-link">Manutenção</a>
            <a href="saida.html" class="navbar-link">Saída Antecipada</a>
            <a href="comunicacao.html" class="navbar-link">Comunicação</a>
        </nav>
    </header>

    <main class="chat-container">

        <aside class="chat-sidebar">
            <input type="text" class="chat-search" placeholder="Pesquisar amigo ou professor...">
            <div class="chat-list-placeholder">
                <p>Nenhum contato recente</p>
            </div>
        </aside>

        <div class="chat-window">
            <div class="chat-messages">
                <p class="chat-empty-text">Selecione uma conversa para começar a se comunicar</p>
            </div>
            <div class="chat-input-area">
                <input type="text" class="chat-input" placeholder="Digite sua mensagem aqui..." disabled>
                <button class="chat-send-btn" disabled>Enviar</button>
            </div>
        </div>

    </main>

    <footer class="footer">
        <span class="text-highlight">SIC</span>
        <small class="footer-copyright">&copy; 2026 Sistema Integrado de Campus. Todos os direitos reservados.</small>
    </footer>

</body>

</html>
